[package]
name = "boltscribe"
version = "1.4.0"
description = "Local-first macOS and Windows voice input with ASR transcription and LLM correction"
authors = ["BoltScribe contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
arboard = { version = "3.4", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
dirs = "6.0"
dunce = "1.0"
flate2 = "1.1.9"
hound = "3.5"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.4.2"
tungstenite = { version = "0.29.0", features = ["native-tls"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
webrtc-vad = "0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }
fs2 = "0.4.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["libc", "std", "NSApplication", "NSPanel", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel.git", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Devices_Properties", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.50"

[features]
custom-protocol = ["tauri/custom-protocol"]
