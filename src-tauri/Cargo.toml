[package]
name = "boltscribe"
version = "1.2.1"
description = "Local-first macOS and Windows voice input with ASR transcription and LLM correction"
authors = ["BoltScribe contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
arboard = { version = "3.4", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
dirs = "6.0"
flate2 = "1.1.9"
hound = "3.5"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3.1"
tungstenite = { version = "0.29.0", features = ["native-tls"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Devices_Properties", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.50"

[features]
custom-protocol = ["tauri/custom-protocol"]
