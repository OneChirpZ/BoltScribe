<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
  <title id="title">BoltScribe voice input workflow</title>
  <desc id="desc">A left-to-right workflow showing hotkey recording, Volcengine ASR, LLM correction, paste injection, and history storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111712"/>
      <stop offset="0.54" stop-color="#151b22"/>
      <stop offset="1" stop-color="#251a10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#f1a93c"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5ffbf"/>
      <stop offset="1" stop-color="#2bc56f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1180" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="160" fill="#2498ff" opacity="0.08"/>
  <circle cx="108" cy="376" r="150" fill="#f5b84b" opacity="0.09"/>

  <text x="52" y="64" fill="#f6f2e8" font-family="Inter, SF Pro Display, Arial, sans-serif" font-size="28" font-weight="750">BoltScribe workflow</text>
  <text x="52" y="96" fill="#9ea79a" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="15">Capture speech anywhere, correct it with an LLM, then paste the final text back into the active app.</text>

  <g transform="translate(50 150)" filter="url(#shadow)">
    <g>
      <rect width="178" height="138" rx="18" fill="#1e241f" stroke="#3a433b"/>
      <rect x="24" y="26" width="64" height="64" rx="18" fill="#0d1110" stroke="#3a433b"/>
      <path d="M59 41v26c0 8-6 14-14 14s-14-6-14-14V41c0-8 6-14 14-14s14 6 14 14z" fill="none" stroke="#f6f2e8" stroke-width="4"/>
      <path d="M73 62c0 15-12 28-28 28S17 77 17 62" fill="none" stroke="#f5b84b" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="112" fill="#f6f2e8" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="18" font-weight="700">Hotkey</text>
      <text x="24" y="134" fill="#9ea79a" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="13">Start / stop</text>
    </g>

    <g transform="translate(230 0)">
      <rect width="178" height="138" rx="18" fill="#202018" stroke="#574728"/>
      <path d="M38 82c12-42 31-42 43 0s31 42 43 0 31-42 43 0" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
      <text x="24" y="112" fill="#f6f2e8" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="18" font-weight="700">ASR</text>
      <text x="24" y="134" fill="#cbbd9a" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="13">Volcengine WebSocket</text>
    </g>

    <g transform="translate(460 0)">
      <rect width="178" height="138" rx="18" fill="#1e232a" stroke="#36495b"/>
      <path d="M50 34h78c12 0 22 10 22 22v22c0 12-10 22-22 22H86l-30 22v-22h-6c-12 0-22-10-22-22V56c0-12 10-22 22-22z" fill="#102c45" stroke="#2498ff" stroke-width="3"/>
      <text x="55" y="73" fill="#e9f5ff" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="18" font-weight="750">LLM</text>
      <text x="24" y="112" fill="#f6f2e8" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="18" font-weight="700">Correction</text>
      <text x="24" y="134" fill="#9bb3c7" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="13">Provider presets</text>
    </g>

    <g transform="translate(690 0)">
      <rect width="178" height="138" rx="18" fill="#17231b" stroke="#2d5a3b"/>
      <rect x="32" y="34" width="114" height="62" rx="12" fill="#0d321f" stroke="#48d480" stroke-width="3"/>
      <path d="M60 64l21 21 42-48" fill="none" stroke="url(#green)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="112" fill="#f6f2e8" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="18" font-weight="700">Paste</text>
      <text x="24" y="134" fill="#a9d8b7" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="13">Accessibility injection</text>
    </g>

    <g transform="translate(920 0)">
      <rect width="178" height="138" rx="18" fill="#232321" stroke="#46433b"/>
      <path d="M42 34h94c8 0 14 6 14 14v58c0 8-6 14-14 14H42c-8 0-14-6-14-14V48c0-8 6-14 14-14z" fill="#171916" stroke="#f5b84b" stroke-width="3"/>
      <path d="M50 58h78M50 78h62M50 98h86" stroke="#d9d3c6" stroke-width="5" stroke-linecap="round"/>
      <text x="24" y="112" fill="#f6f2e8" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="18" font-weight="700">History</text>
      <text x="24" y="134" fill="#bcb5a7" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="13">Retention controls</text>
    </g>
  </g>

  <g fill="none" stroke="#f5b84b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M240 219h46"/>
    <path d="M280 213l8 6-8 6"/>
    <path d="M470 219h46"/>
    <path d="M510 213l8 6-8 6"/>
    <path d="M700 219h46"/>
    <path d="M740 213l8 6-8 6"/>
    <path d="M930 219h46"/>
    <path d="M970 213l8 6-8 6"/>
  </g>

  <g transform="translate(52 342)">
    <rect width="1076" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="28" cy="21" r="7" fill="#111712"/>
    <circle cx="52" cy="21" r="7" fill="#f5b84b"/>
    <circle cx="76" cy="21" r="7" fill="#48d480"/>
    <circle cx="100" cy="21" r="7" fill="#e25e56"/>
    <text x="124" y="26" fill="#d9d3c6" font-family="Inter, SF Pro Text, Arial, sans-serif" font-size="14">Overlay states: recording black · processing yellow · pasted green · error red</text>
  </g>
</svg>
